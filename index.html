<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonnon Store - ช่องทางการชำระเงิน</title>
   
    <script src="https://cdn.tailwindcss.com"></script>
   
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
   
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    },
                    colors: {
                        cute: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
   
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #dbeafe;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #93c5fd; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #60a5fa; }
       
        @keyframes slideDown {
            from { transform: translate(-50%, -100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        @keyframes floatUp {
            from { transform: translateY(15px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-enter {
            animation: slideDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .upload-overlay {
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .group:hover .upload-overlay {
            opacity: 1;
        }
        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
    </style>
</head>
<body class="text-cute-900 antialiased selection:bg-cute-200 selection:text-cute-900">


    <nav class="fixed top-0 w-full glass-nav border-b border-cute-200 shadow-[0_4px_20px_-10px_rgba(59,130,246,0.15)] z-40 transition-all duration-300">
        <div class="max-w-md mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 bg-gradient-to-tr from-cute-300 to-cute-100 rounded-full flex items-center justify-center text-cute-700 font-extrabold text-xs shadow-inner ring-2 ring-white">NN</div>
                <span class="font-bold text-cute-800 tracking-wide text-sm">Nonnon Store</span>
            </div>
            <div class="flex bg-white/60 p-1.5 rounded-full shadow-inner ring-1 ring-cute-200/50 backdrop-blur-sm">
                <button onclick="switchView('public')" id="btn-view-public" class="px-4 py-1.5 text-[13px] font-semibold rounded-full bg-white text-cute-600 shadow-sm transition-all duration-300">หน้าร้าน</button>
                <button onclick="switchView('admin')" id="btn-view-admin" class="px-4 py-1.5 text-[13px] font-medium rounded-full text-cute-500 hover:text-cute-700 transition-all duration-300">แอดมิน</button>
            </div>
        </div>
    </nav>


    <main class="w-full min-h-screen pt-16 pb-20 flex justify-center items-start">
        <div id="app-container" class="w-full max-w-md bg-gradient-to-b from-[#eff6ff] via-[#eff6ff] to-[#dbeafe] min-h-screen shadow-2xl relative overflow-hidden transition-all duration-500">
            <div class="flex items-center justify-center h-screen">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-cute-500"></div>
            </div>
        </div>
    </main>


    <div id="toast" class="fixed top-24 left-1/2 transform -translate-x-1/2 bg-cute-800 text-white px-6 py-3.5 rounded-2xl shadow-[0_10px_40px_-10px_rgba(30,64,175,0.5)] flex items-center space-x-3 z-50 hidden opacity-0 transition-opacity duration-300">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span id="toast-message" class="text-sm font-medium tracking-wide">ข้อความแจ้งเตือน</span>
    </div>


    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-[70] hidden items-center justify-center opacity-0 transition-opacity duration-300 px-4">
        <div class="bg-white rounded-[24px] p-6 w-full max-w-xs shadow-2xl transform scale-95 transition-transform duration-300" id="login-box">
            <div class="w-12 h-12 rounded-full bg-cute-100 flex items-center justify-center mb-4 mx-auto text-cute-500">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </div>
            <h3 class="text-lg font-bold text-slate-800 mb-2 text-center">เข้าสู่ระบบแอดมิน</h3>
            <p class="text-[13px] text-slate-500 mb-5 text-center leading-relaxed">กรุณาใส่รหัสผ่านเพื่อจัดการร้านค้า<br>(รหัสผ่านสำหรับทดสอบ: <span class="font-mono text-cute-600 bg-cute-50 px-1 rounded">admin</span>)</p>
            <input type="password" id="admin-password" class="w-full px-4 py-3 bg-cute-50/50 border-2 border-cute-100 rounded-[16px] focus:bg-white focus:border-cute-400 outline-none text-center mb-6 text-slate-800 tracking-widest transition-colors font-mono" placeholder="••••••••" onkeypress="if(event.key === 'Enter') attemptLogin()">
            <div class="flex space-x-3 justify-center">
                <button onclick="closeLoginModal()" class="px-5 py-2.5 rounded-xl text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors w-1/2">ยกเลิก</button>
                <button onclick="attemptLogin()" class="px-5 py-2.5 rounded-xl text-sm font-bold text-white bg-cute-500 hover:bg-cute-600 shadow-md shadow-cute-500/20 transition-colors w-1/2">ตกลง</button>
            </div>
        </div>
    </div>


    <!-- Confirm Delete Modal -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-[60] hidden items-center justify-center opacity-0 transition-opacity duration-300 px-4">
        <div class="bg-white rounded-[24px] p-6 w-full max-w-xs shadow-2xl transform scale-95 transition-transform duration-300" id="confirm-box">
            <div class="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center mb-4 mx-auto">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            </div>
            <h3 class="text-lg font-bold text-slate-800 mb-2 text-center">ยืนยันการลบ</h3>
            <p class="text-sm text-slate-500 mb-6 text-center leading-relaxed">แน่ใจหรือไม่ว่าต้องการลบช่องทางนี้? <br> ข้อมูลจะไม่สามารถกู้คืนได้</p>
            <div class="flex space-x-3 justify-center">
                <button id="btn-cancel-delete" class="px-5 py-2.5 rounded-xl text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors w-1/2">ยกเลิก</button>
                <button id="btn-confirm-delete" class="px-5 py-2.5 rounded-xl text-sm font-bold text-white bg-red-500 hover:bg-red-600 shadow-md shadow-red-500/20 transition-colors w-1/2">ลบข้อมูล</button>
            </div>
        </div>
    </div>


    <input type="file" id="upload-logo" accept="image/*" class="hidden" onchange="handleImageUpload(event, 'logo')">
    <input type="file" id="upload-content" accept="image/*" class="hidden" onchange="handleImageUpload(event, 'content')">
    <input type="file" id="upload-payment-icon" accept="image/*" class="hidden" onchange="handlePaymentIconUpload(event)">


    <script>
        const icons = {
            copy: `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`,
            bank: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>`,
            trash: `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`,
            camera: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>`,
            facebook: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>`,
            line: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M24 10.304c0-5.369-5.383-9.738-12-9.738-6.616 0-12 4.369-12 9.738 0 4.814 3.961 8.924 9.539 9.605.372.078.878.243 1.002.585.111.309.071.791.034 1.139-.043.415-.276 1.62-.338 1.953-.1.541-.497 2.456 2.148 1.341 2.645-1.115 7.159-4.218 9.387-6.938 1.503-1.841 2.228-3.791 2.228-5.748l-.001-.002zM7.552 13.064c-.318 0-.575-.257-.575-.575v-4.526c0-.318.257-.575.575-.575s.575.257.575.575v3.951h2.502c.318 0 .575.257.575.575s-.257.575-.575.575H7.552zm6.182-1.229c0 .318-.257.575-.575.575s-.575-.257-.575-.575V8.539c0-.318.257-.575.575-.575s.575.257.575.575v3.296h-1.15v-2.067h1.15v2.067zm2.396.575c-.318 0-.575-.257-.575-.575V8.539c0-.318.257-.575.575-.575s.575.257.575.575v4.526c0 .318-.257.575-.575.575zm3.899-4.526v3.297l-2.029-3.21c-.089-.133-.232-.218-.386-.226-.013-.001-.027-.001-.04-.001-.157 0-.306.064-.413.176-.118.125-.175.297-.156.467v4.526c0 .318.257.575.575.575s.575-.257.575-.575V9.767l2.029 3.21c.089.133.232.218.386.226.013.001.027.001.04.001.157 0 .306-.064.413-.176.118-.125.175-.297.156-.467V8.539c0-.318-.257-.575-.575-.575s-.575.257-.575.575z"/></svg>`,
            instagram: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>`
        };


        const socialLinks = {
            line: "https://lin.ee/NNKqu9g",
            facebook: "https://www.facebook.com/share/19fLAacTiP/",
            instagram: "https://www.instagram.com/nonnon_store06?stkn=MXV2ZHJhdGF6MHF1aQ=="
        };


        const defaultData = {
            store: {
                logo: "https://placehold.co/300x300/eff6ff/3b82f6?text=NN",
                contentImage: "https://placehold.co/800x600/bfdbfe/2563eb?text=รูปภาพประกอบ",
                tagline: "ยินดีต้อนรับสู่ร้าน Nonnon Store 💙\nชำระเงินแล้วรบกวนแจ้งสลิปด้วยนะคะ"
            },
            payments: [
                { id: 1, bankName: 'ธนาคารกสิกรไทย (KBank)', accountName: 'ชื่อบัญชี นามสกุล', accountNo: '123-4-56789-0', color: '#10B981', iconImage: '', isActive: true },
                { id: 2, bankName: 'พร้อมเพย์ (PromptPay)', accountName: 'ชื่อบัญชี นามสกุล', accountNo: '081-234-5678', color: '#1e3a8a', iconImage: '', isActive: true },
                { id: 3, bankName: 'TrueMoney Wallet', accountName: 'ชื่อบัญชี นามสกุล', accountNo: '081-234-5678', color: '#F97316', iconImage: '', isActive: false }
            ]
        };


        let currentView = 'public';
        let appData = { ...defaultData };
        let itemToDelete = null;
        let activePaymentIdForUpload = null;
       
        let isLoggedIn = false;
        const MOCK_PASSWORD = "admin";


        const loadData = () => {
            const savedData = localStorage.getItem('nonnon_store_data_v4');
            if (savedData) {
                try {
                    appData = JSON.parse(savedData);
                    // Ensure iconImage exists for old saves
                    appData.payments.forEach(p => {
                        if(p.iconImage === undefined) p.iconImage = '';
                    });
                } catch(e) {
                    console.error("Error loading data", e);
                }
            }
        };


        const saveData = () => {
            localStorage.setItem('nonnon_store_data_v4', JSON.stringify(appData));
        };


        const switchView = (view) => {
            if (view === 'admin' && !isLoggedIn) {
                openLoginModal();
                return;
            }
            currentView = view;
           
            const btnPublic = document.getElementById('btn-view-public');
            const btnAdmin = document.getElementById('btn-view-admin');
           
            if(view === 'public') {
                btnPublic.className = "px-4 py-1.5 text-[13px] font-semibold rounded-full bg-white text-cute-600 shadow-sm transition-all duration-300";
                btnAdmin.className = "px-4 py-1.5 text-[13px] font-medium rounded-full text-cute-500 hover:text-cute-700 transition-all duration-300";
            } else {
                btnAdmin.className = "px-4 py-1.5 text-[13px] font-semibold rounded-full bg-white text-cute-600 shadow-sm transition-all duration-300";
                btnPublic.className = "px-4 py-1.5 text-[13px] font-medium rounded-full text-cute-500 hover:text-cute-700 transition-all duration-300";
            }
            render();
        };


        const showToast = (message, isError = false) => {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            msgEl.innerText = message;
           
            if (isError) {
                toast.classList.replace('bg-cute-800', 'bg-red-500');
            } else {
                toast.classList.replace('bg-red-500', 'bg-cute-800');
            }


            toast.classList.remove('hidden', 'opacity-0');
            toast.classList.add('toast-enter');
           
            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('opacity-0');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 2500);
        };


        const openLoginModal = () => {
            const modal = document.getElementById('login-modal');
            const box = document.getElementById('login-box');
            document.getElementById('admin-password').value = '';
            modal.classList.remove('hidden');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            box.classList.remove('scale-95');
            modal.classList.add('flex');
            setTimeout(() => document.getElementById('admin-password').focus(), 100);
        };


        const closeLoginModal = () => {
            const modal = document.getElementById('login-modal');
            const box = document.getElementById('login-box');
            modal.classList.add('opacity-0');
            box.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        };


        const attemptLogin = () => {
            const pwInput = document.getElementById('admin-password');
            if (pwInput.value === MOCK_PASSWORD) {
                isLoggedIn = true;
                closeLoginModal();
                showToast('เข้าสู่ระบบสำเร็จ');
                switchView('admin');
            } else {
                showToast('รหัสผ่านไม่ถูกต้อง!', true);
                pwInput.value = '';
                pwInput.focus();
            }
        };


        const logout = () => {
            isLoggedIn = false;
            switchView('public');
            showToast('ออกจากระบบเรียบร้อยแล้ว');
        };


        window.copyText = (text) => {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast(`คัดลอก: ${text}`);
            } catch (err) {
                showToast('ไม่สามารถคัดลอกได้ กรุณาลองใหม่', true);
            }
            document.body.removeChild(textarea);
        };


        const compressImage = (file, maxWidth, maxHeight, quality, callback) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function (event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function () {
                    let width = img.width;
                    let height = img.height;
                   
                    if (width > height) {
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width = Math.round((width * maxHeight) / height);
                            height = maxHeight;
                        }
                    }


                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                   
                    // Removed white background fill to support transparency!
                    ctx.drawImage(img, 0, 0, width, height);
                   
                    // Use WebP instead of JPEG to preserve transparent background and reduce size
                    const dataUrl = canvas.toDataURL('image/webp', quality);
                    callback(dataUrl);
                };
            };
        };


        window.triggerUpload = (inputId) => {
            document.getElementById(inputId).click();
        };


        window.triggerPaymentIconUpload = (id) => {
            activePaymentIdForUpload = id;
            document.getElementById('upload-payment-icon').click();
        };


        window.handleImageUpload = (event, type) => {
            const file = event.target.files[0];
            if (!file) return;


            const maxWidth = type === 'content' ? 1000 : 400;
            const maxHeight = type === 'content' ? 1000 : 400;
            const quality = 0.7;


            showToast('กำลังประมวลผลรูปภาพ...');
            compressImage(file, maxWidth, maxHeight, quality, (compressedDataUrl) => {
                if (type === 'logo') {
                    appData.store.logo = compressedDataUrl;
                } else if (type === 'content') {
                    appData.store.contentImage = compressedDataUrl;
                }
                saveData();
                render();
                showToast('อัปเดตรูปภาพสำเร็จ 💙');
                event.target.value = '';
            });
        };


        window.handlePaymentIconUpload = (event) => {
            const file = event.target.files[0];
            if (!file || activePaymentIdForUpload === null) return;


            showToast('กำลังประมวลผลไอคอน...');
            compressImage(file, 200, 200, 0.8, (compressedDataUrl) => {
                updatePayment(activePaymentIdForUpload, 'iconImage', compressedDataUrl);
                event.target.value = '';
                activePaymentIdForUpload = null;
                showToast('อัปเดตไอคอนสำเร็จ 💙');
                render();
            });
        };


        window.updateStoreText = (key, value) => {
            appData.store[key] = value;
            saveData();
        };


        window.addPaymentMethod = () => {
            const newId = appData.payments.length > 0 ? Math.max(...appData.payments.map(p => p.id)) + 1 : 1;
            appData.payments.push({
                id: newId,
                bankName: '',
                accountName: '',
                accountNo: '',
                color: '#60a5fa',
                iconImage: '',
                isActive: true
            });
            saveData();
            render();
            setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 100);
        };


        window.updatePayment = (id, field, value) => {
            const index = appData.payments.findIndex(p => p.id === id);
            if (index > -1) {
                appData.payments[index][field] = value;
                saveData();
                if(field === 'color') render(); // Live update for color preview
            }
        };


        window.togglePaymentStatus = (id) => {
            const index = appData.payments.findIndex(p => p.id === id);
            if (index > -1) {
                appData.payments[index].isActive = !appData.payments[index].isActive;
                saveData();
                render();
            }
        };


        window.openDeleteModal = (id) => {
            itemToDelete = id;
            const modal = document.getElementById('confirm-modal');
            const box = document.getElementById('confirm-box');
            modal.classList.remove('hidden');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            box.classList.remove('scale-95');
            modal.classList.add('flex');
        };


        const closeConfirmModal = () => {
            const modal = document.getElementById('confirm-modal');
            const box = document.getElementById('confirm-box');
            modal.classList.add('opacity-0');
            box.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
            itemToDelete = null;
        };


        document.getElementById('btn-cancel-delete').addEventListener('click', closeConfirmModal);
        document.getElementById('btn-confirm-delete').addEventListener('click', () => {
            if(itemToDelete !== null) {
                appData.payments = appData.payments.filter(p => p.id !== itemToDelete);
                saveData();
                render();
                showToast('ลบข้อมูลเรียบร้อยแล้ว');
            }
            closeConfirmModal();
        });


        const renderPublicView = () => {
            const activePayments = appData.payments.filter(p => p.isActive);
            const formattedTagline = appData.store.tagline ? appData.store.tagline.replace(/\n/g, '<br/>') : '';


            let paymentsHTML = '';
            if (activePayments.length === 0) {
                paymentsHTML = `<div class="text-center text-cute-400 py-10 bg-white/50 rounded-[24px] border border-cute-200 border-dashed">ยังไม่มีช่องทางการชำระเงินที่เปิดใช้งาน</div>`;
            } else {
                activePayments.forEach((p, index) => {
                    const delay = index * 0.08;
                    // Render image if uploaded, otherwise fallback to SVG bank icon
                    const iconDisplay = p.iconImage
                        ? `<img src="${p.iconImage}" class="w-full h-full object-contain p-[2px] relative z-10" alt="icon">`
                        : `<div class="relative z-10 scale-[1.15] drop-shadow-sm">${icons.bank}</div>`;


                    paymentsHTML += `
                        <div class="bg-white rounded-[24px] p-4 sm:p-5 border-2 border-transparent hover:border-cute-200 shadow-[0_4px_20px_-5px_rgba(59,130,246,0.05)] hover:shadow-[0_12px_30px_-5px_rgba(59,130,246,0.15)] hover:-translate-y-1 transition-all duration-300 flex items-center justify-between group animate-[floatUp_0.4s_ease-out_forwards]" style="animation-delay: ${delay}s; opacity: 0;">
                            <div class="flex items-center space-x-4 overflow-hidden">
                                <div class="w-14 h-14 rounded-[18px] flex items-center justify-center text-white flex-shrink-0 shadow-inner relative overflow-hidden bg-cute-100" style="${p.color ? `background-color: ${p.color};` : ''}">
                                    <div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                                    ${iconDisplay}
                                </div>
                                <div class="flex flex-col min-w-0 pr-2 space-y-0.5">
                                    <span class="font-bold text-slate-800 text-[15px] truncate">${p.bankName || 'ไม่ได้ระบุชื่อ'}</span>
                                    <span class="text-[13px] text-slate-500 truncate">${p.accountName || 'ไม่ได้ระบุชื่อบัญชี'}</span>
                                    <span class="font-mono font-bold text-cute-600 mt-1 text-[15px] tracking-widest bg-cute-50/80 w-fit px-3 py-1 rounded-xl border border-cute-100">${p.accountNo || '-'}</span>
                                </div>
                            </div>
                            <button
                                onclick="copyText('${p.accountNo}')"
                                class="w-12 h-12 rounded-full bg-cute-50 text-cute-500 flex items-center justify-center hover:bg-cute-500 hover:text-white flex-shrink-0 transition-all duration-300 active:scale-90 shadow-sm border border-cute-100 group-hover:border-transparent"
                                title="คัดลอกเลขบัญชี"
                            >
                                ${icons.copy}
                            </button>
                        </div>
                    `;
                });
            }


            return `
                <div class="flex flex-col w-full items-center pt-8 pb-10 animate-[slideDown_0.4s_ease-out]">
                   
                    <div class="relative flex flex-col items-center w-full px-6 stagger-1 animate-[floatUp_0.5s_ease-out_forwards] opacity-0">
                        <div class="w-28 h-28 sm:w-32 sm:h-32 rounded-full border-[6px] border-white shadow-[0_10px_30px_rgba(59,130,246,0.15)] overflow-hidden bg-white z-10 relative">
                            <img src="${appData.store.logo}" alt="Logo" class="w-full h-full object-cover transition-transform duration-500 hover:scale-110" onerror="this.src='https://placehold.co/300x300/eff6ff/3b82f6?text=Logo'">
                        </div>
                       
                        ${appData.store.tagline ? `
                        <div class="mt-6 text-center px-8 py-4 bg-white/60 backdrop-blur-md rounded-3xl shadow-[0_4px_20px_-5px_rgba(59,130,246,0.05)] border border-white text-slate-700 text-sm sm:text-base font-medium leading-relaxed max-w-[95%] relative">
                            ${formattedTagline}
                        </div>
                        ` : ''}


                        ${appData.store.contentImage ? `
                        <div class="mt-6 w-full max-w-[95%] rounded-[32px] overflow-hidden shadow-[0_15px_40px_-10px_rgba(59,130,246,0.15)] border-[5px] border-white relative group stagger-2 animate-[floatUp_0.5s_ease-out_forwards] opacity-0" style="animation-delay: 0.15s">
                            <img src="${appData.store.contentImage}" alt="Content" class="w-full h-auto object-cover" onerror="this.src='https://placehold.co/800x600/bfdbfe/2563eb?text=รูปภาพ'">
                        </div>
                        ` : ''}
                    </div>


                    <div class="w-full px-5 mt-10 space-y-5 flex-1 stagger-3">
                        <div class="flex items-center justify-center mb-6">
                            <div class="h-[2px] bg-gradient-to-r from-transparent to-cute-300 flex-1 rounded-full opacity-50"></div>
                            <h2 class="px-5 text-center font-bold text-cute-900 text-sm tracking-widest bg-white/40 backdrop-blur-sm py-2 rounded-full border border-white uppercase">ช่องทางการชำระเงิน</h2>
                            <div class="h-[2px] bg-gradient-to-l from-transparent to-cute-300 flex-1 rounded-full opacity-50"></div>
                        </div>
                        <div class="space-y-4">
                            ${paymentsHTML}
                        </div>
                    </div>


                    <div class="mt-12 pt-4 w-full flex justify-center space-x-6">
                        <a href="${socialLinks.line}" target="_blank" class="w-14 h-14 bg-white text-[#00B900] rounded-full flex items-center justify-center shadow-[0_8px_20px_rgb(0,185,0,0.15)] hover:shadow-[0_10px_25px_rgb(0,185,0,0.25)] border-2 border-transparent hover:-translate-y-1.5 transition-all duration-300">
                            <div class="scale-125">${icons.line}</div>
                        </a>
                        <a href="${socialLinks.facebook}" target="_blank" class="w-14 h-14 bg-white text-[#1877F2] rounded-full flex items-center justify-center shadow-[0_8px_20px_rgb(24,119,242,0.15)] hover:shadow-[0_10px_25px_rgb(24,119,242,0.25)] border-2 border-transparent hover:-translate-y-1.5 transition-all duration-300">
                            <div class="scale-125">${icons.facebook}</div>
                        </a>
                        <a href="${socialLinks.instagram}" target="_blank" class="w-14 h-14 bg-white text-[#E1306C] rounded-full flex items-center justify-center shadow-[0_8px_20px_rgb(225,48,108,0.15)] hover:shadow-[0_10px_25px_rgb(225,48,108,0.25)] border-2 border-transparent hover:-translate-y-1.5 transition-all duration-300">
                            <div class="scale-125">${icons.instagram}</div>
                        </a>
                    </div>
                </div>
            `;
        };


        const renderAdminView = () => {
            let paymentsAdminHTML = '';
           
            appData.payments.forEach((p, index) => {
                const iconPreview = p.iconImage
                    ? `<img src="${p.iconImage}" class="w-full h-full object-contain p-1 relative z-10" alt="icon">`
                    : `<div class="scale-75 text-white">${icons.bank}</div>`;


                paymentsAdminHTML += `
                    <div class="bg-white border-[3px] border-cute-50 rounded-[28px] p-5 space-y-4 shadow-sm relative hover:border-cute-200 transition-colors">
                        <div class="flex justify-between items-center border-b border-cute-50 pb-4">
                            <div class="flex items-center space-x-3">
                                <div class="w-9 h-9 rounded-[10px] flex items-center justify-center text-white shadow-inner bg-cute-100 overflow-hidden relative" style="${p.color ? `background-color: ${p.color};` : ''}">
                                    ${iconPreview}
                                </div>
                                <span class="font-bold text-slate-800">ช่องทางที่ ${index + 1}</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <button onclick="togglePaymentStatus(${p.id})" class="text-[11px] font-bold px-4 py-2 rounded-xl transition-all duration-200 ${p.isActive ? 'bg-cute-100 text-cute-700 hover:bg-cute-200' : 'bg-slate-100 text-slate-400 hover:bg-slate-200'}">
                                    ${p.isActive ? 'เปิดใช้งาน' : 'ปิด'}
                                </button>
                                <button onclick="openDeleteModal(${p.id})" class="text-slate-300 hover:text-red-500 hover:bg-red-50 p-2 rounded-xl transition-colors">
                                    ${icons.trash}
                                </button>
                            </div>
                        </div>


                        <div class="grid grid-cols-1 gap-3.5 pt-1">
                            <div>
                                <label class="block text-[12px] font-bold text-slate-500 mb-1.5 ml-1">ชื่อธนาคาร / แอปพลิเคชัน</label>
                                <input type="text" value="${p.bankName}" onchange="updatePayment(${p.id}, 'bankName', this.value)" class="w-full px-4 py-3 text-[14px] bg-cute-50/50 border-2 border-cute-100 rounded-[16px] focus:bg-white focus:border-cute-300 outline-none transition-all text-slate-800 placeholder:text-slate-300" placeholder="เช่น ธนาคารกสิกรไทย">
                            </div>
                            <div>
                                <label class="block text-[12px] font-bold text-slate-500 mb-1.5 ml-1">ชื่อบัญชี</label>
                                <input type="text" value="${p.accountName}" onchange="updatePayment(${p.id}, 'accountName', this.value)" class="w-full px-4 py-3 text-[14px] bg-cute-50/50 border-2 border-cute-100 rounded-[16px] focus:bg-white focus:border-cute-300 outline-none transition-all text-slate-800 placeholder:text-slate-300" placeholder="เช่น นายสมชาย ใจดี">
                            </div>
                            <div>
                                <label class="block text-[12px] font-bold text-slate-500 mb-1.5 ml-1">เลขบัญชี / เบอร์โทรศัพท์</label>
                                <input type="text" value="${p.accountNo}" onchange="updatePayment(${p.id}, 'accountNo', this.value)" class="w-full px-4 py-3 text-[14px] bg-cute-50/50 border-2 border-cute-100 rounded-[16px] focus:bg-white focus:border-cute-300 outline-none font-mono transition-all text-cute-700 font-bold placeholder:text-slate-300" placeholder="เช่น 123-4-56789-0">
                            </div>
                           
                            <div class="flex space-x-4">
                                <div class="flex-1">
                                    <label class="block text-[12px] font-bold text-slate-500 mb-1.5 ml-1">รูปไอคอน (รองรับพื้นหลังใส)</label>
                                    <div class="flex items-center space-x-3">
                                        <div class="relative w-12 h-12 rounded-[14px] border-2 border-dashed border-cute-300 overflow-hidden group cursor-pointer hover:border-cute-500 transition-colors flex items-center justify-center bg-cute-50/50" onclick="triggerPaymentIconUpload(${p.id})">
                                            ${p.iconImage ? `<img src="${p.iconImage}" class="w-full h-full object-contain p-1">` : `<div class="scale-75 text-cute-400">${icons.camera}</div>`}
                                            <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center upload-overlay">
                                                <div class="text-white scale-[0.6]">${icons.camera}</div>
                                            </div>
                                        </div>
                                        <button onclick="updatePayment(${p.id}, 'iconImage', '')" class="text-[11px] text-slate-400 hover:text-red-500 underline decoration-dotted">ลบรูป</button>
                                    </div>
                                </div>
                                <div class="flex-1">
                                    <label class="block text-[12px] font-bold text-slate-500 mb-1.5 ml-1">สีพื้นหลังไอคอน</label>
                                    <div class="flex items-center space-x-2">
                                        <input type="color" value="${p.color}" onchange="updatePayment(${p.id}, 'color', this.value)" class="w-12 h-12 p-1 border-2 border-cute-100 rounded-[14px] cursor-pointer bg-white overflow-hidden flex-shrink-0">
                                        <input type="text" value="${p.color}" onchange="updatePayment(${p.id}, 'color', this.value)" class="w-full px-3 py-3 text-[12px] bg-cute-50/50 border-2 border-cute-100 rounded-[14px] focus:bg-white focus:border-cute-300 outline-none font-mono uppercase text-slate-700 transition-all">
                                    </div>
                                </div>
                            </div>


                        </div>
                    </div>
                `;
            });


            return `
                <div class="p-5 bg-transparent w-full animate-[slideDown_0.3s_ease-out]">
                    <div class="mb-8 pt-4 px-2 flex justify-between items-start">
                        <div>
                            <h1 class="text-[22px] font-bold text-slate-800 flex items-center space-x-2">
                                <span class="text-cute-500">⚙️</span>
                                <span>ตั้งค่าร้านค้า</span>
                            </h1>
                            <p class="text-sm text-slate-500 mt-2">จัดการข้อมูลและรูปภาพ บันทึกอัตโนมัติ 💙</p>
                        </div>
                        <button onclick="logout()" class="px-4 py-2 bg-red-50 text-red-500 rounded-xl text-xs font-bold hover:bg-red-100 hover:text-red-600 transition-colors flex items-center space-x-1 shadow-sm border border-red-100">
                            <span>ออกจากระบบ</span>
                        </button>
                    </div>


                    <div class="mb-10 space-y-5">
                        <div class="flex items-center space-x-2 px-2">
                            <div class="w-2 h-5 bg-cute-400 rounded-full"></div>
                            <h2 class="text-[15px] font-bold text-slate-700">รูปภาพและข้อความ</h2>
                        </div>
                       
                        <div class="grid grid-cols-2 gap-4">
                            <div class="flex flex-col items-center space-y-3 p-5 bg-white rounded-[28px] shadow-sm border-[3px] border-cute-50 hover:border-cute-100 transition-colors">
                                <label class="block text-[11px] font-bold text-slate-400 w-full text-center">โลโก้ร้าน (รองรับ PNG)</label>
                                <div class="relative w-[84px] h-[84px] rounded-full border-[3px] border-dashed border-cute-300 overflow-hidden group cursor-pointer hover:border-cute-500 transition-colors" onclick="triggerUpload('upload-logo')">
                                    <img src="${appData.store.logo}" alt="Logo Preview" class="w-full h-full object-contain">
                                    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center upload-overlay">
                                        <div class="text-white scale-75">${icons.camera}</div>
                                    </div>
                                </div>
                            </div>


                            <div class="flex flex-col items-center space-y-3 p-5 bg-white rounded-[28px] shadow-sm border-[3px] border-cute-50 hover:border-cute-100 transition-colors">
                                <label class="block text-[11px] font-bold text-slate-400 w-full text-center">รูปใต้คำโปรย</label>
                                <div class="relative w-full h-[84px] rounded-[20px] border-[3px] border-dashed border-cute-300 overflow-hidden group cursor-pointer hover:border-cute-500 transition-colors" onclick="triggerUpload('upload-content')">
                                    <img src="${appData.store.contentImage}" alt="Content Preview" class="w-full h-full object-cover">
                                    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center upload-overlay">
                                        <div class="text-white scale-75">${icons.camera}</div>
                                    </div>
                                </div>
                            </div>
                        </div>


                        <div class="bg-white p-2 rounded-[28px] shadow-sm border-[3px] border-cute-50">
                            <textarea rows="3" onchange="updateStoreText('tagline', this.value)" placeholder="คำโปรย หรือข้อความต้อนรับ..." class="w-full px-4 py-3 text-[14px] bg-transparent rounded-xl focus:bg-cute-50/30 outline-none resize-none transition-colors text-slate-700 leading-relaxed">${appData.store.tagline}</textarea>
                        </div>
                    </div>


                    <div class="space-y-5">
                        <div class="flex justify-between items-center px-2">
                            <div class="flex items-center space-x-2">
                                <div class="w-2 h-5 bg-cute-400 rounded-full"></div>
                                <h2 class="text-[15px] font-bold text-slate-700">ช่องทางรับเงิน</h2>
                            </div>
                            <button onclick="addPaymentMethod()" class="text-[12px] font-bold bg-cute-500 hover:bg-cute-600 text-white px-4 py-2.5 rounded-xl transition-all shadow-[0_4px_14px_0_rgba(59,130,246,0.4)] hover:shadow-[0_6px_20px_rgba(59,130,246,0.25)] hover:-translate-y-0.5 active:translate-y-0 flex items-center space-x-1">
                                <span>+ เพิ่มช่องทาง</span>
                            </button>
                        </div>


                        <div class="space-y-4">
                            ${paymentsAdminHTML}
                            ${appData.payments.length === 0 ? '<div class="text-center text-slate-400 py-10 bg-white rounded-[28px] border-[3px] border-dashed border-cute-100 font-medium text-sm">ยังไม่มีข้อมูล กรุณาเพิ่มช่องทาง</div>' : ''}
                        </div>
                    </div>
                </div>
            `;
        };


        const render = () => {
            const container = document.getElementById('app-container');
            if (currentView === 'public') {
                container.innerHTML = renderPublicView();
            } else {
                container.innerHTML = renderAdminView();
            }
        };


        window.onload = () => {
            loadData();
            render();
        };
    </script>
</body>
</html>
