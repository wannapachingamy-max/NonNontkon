<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NONNON STORE - ช่องทางชำระเงิน</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            margin: 0;
            padding: 40px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #334155;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            background-color: #f0f7ff;
            background-image: 
                radial-gradient(#bae6fd 1.5px, transparent 1.5px),
                radial-gradient(#e0f2fe 0.5px, transparent 0.5px);
            background-size: 50px 50px, 100px 100px;
        }

        .star {
            position: absolute;
            top: -100px;
            width: 2px;
            height: 100px;
            background: linear-gradient(180deg, transparent, #38bdf8);
            animation: shootingStar linear infinite;
            opacity: 0;
            z-index: 0;
        }
        @keyframes shootingStar {
            0% { transform: translateY(0) translateX(0) rotate(-45deg); opacity: 0; }
            10% { opacity: 0.7; }
            100% { transform: translateY(120vh) translateX(-120vh) rotate(-45deg); opacity: 0; }
        }
        .star:nth-child(1) { left: 15%; animation-duration: 4s; animation-delay: 0s; }
        .star:nth-child(2) { left: 35%; animation-duration: 6s; animation-delay: 1s; }
        .star:nth-child(3) { left: 55%; animation-duration: 3.5s; animation-delay: 2.5s; }
        .star:nth-child(4) { left: 75%; animation-duration: 5s; animation-delay: 0.5s; }

        @keyframes buttonWobble {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(2deg) scale(1.03); }
            50% { transform: rotate(-2deg) scale(1.03); }
            75% { transform: rotate(2deg) scale(1.03); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .btn-copy {
            background-color: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 #bfdbfe;
            position: relative;
            top: 0;
            transition: 0.1s;
            animation: buttonWobble 2s infinite ease-in-out;
        }
        .btn-copy:active { top: 3px; box-shadow: none; animation: none; }

        .emoji-fly {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            opacity: 0.6;
            animation: emojiFloat linear infinite;
        }
        @keyframes emojiFloat {
            0% { transform: translateY(110vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(-10vh) translateX(50px) rotate(360deg); opacity: 0; }
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: bold;
            color: #1e40af;
            text-transform: uppercase;
            position: relative;
            z-index: 10;
        }

        .main-container {
            max-width: 400px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .card-img {
            background: rgba(255, 255, 255, 0.9);
            padding: 12px;
            border-radius: 28px;
            border: 2px solid #bae6fd;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.15);
            margin-bottom: 20px;
        }
        .card-img img { width: 100%; border-radius: 18px; display: block; }

        .card-content {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 20px;
            border-radius: 28px;
            border: 2px solid #bae6fd;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.15);
            text-align: center;
        }

        .status-bar {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 16px;
            padding: 12px;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            color: #16a34a;
        }

        .bank-row {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            transition: transform 0.2s;
        }
        .bank-row:hover {
            border-color: #93c5fd;
            background: #fff;
        }

        .bank-info { display: flex; align-items: center; gap: 14px; text-align: left; }
        .bank-logo { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid #e2e8f0; font-size: 14px; }

        .social-section {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        .social-btn {
            flex: 1;
            padding: 10px 0;
            border-radius: 14px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: 0.2s;
        }
        .social-btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-line { background-color: #06c755; }
        .btn-fb { background-color: #1877f2; }
        .btn-ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }

        .footer-note {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #cbd5e1;
            font-size: 11px;
            color: #64748b;
            line-height: 1.6;
        }

        /* --- ปุ่มเปิดหลังบ้าน --- */
        .admin-toggle-btn {
            margin-top: 20px;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
        }
        .admin-toggle-btn:hover { color: #2563eb; }

        /* --- สไตล์ส่วนหลังบ้าน (Admin Panel) --- */
        .admin-panel {
            display: none;
            margin-top: 25px;
            background: #fff;
            border: 2px dashed #93c5fd;
            padding: 20px;
            border-radius: 20px;
            text-align: left;
        }
        .admin-panel h3 { margin-top: 0; font-size: 16px; color: #1e40af; display: flex; justify-content: space-between; align-items: center; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 13px; box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        
        .admin-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .btn-action { padding: 4px 10px; border-radius: 6px; border: none; cursor: font-size: 12px; font-weight: 600; }
        .btn-toggle { background: #e0f2fe; color: #0369a1; }
        .btn-toggle.closed { background: #fee2e2; color: #991b1b; }
        .btn-del { background: #fee2e2; color: #ef4444; margin-left: 6px; }

        .btn-save-add {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-save-add:hover { background: #1d4ed8; }

        #toast {
            position: fixed;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: #2563eb;
            color: white;
            padding: 12px 28px;
            border-radius: 999px;
            transition: top 0.4s;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div>

    <div id="toast">บันทึกสำเร็จ ✨</div>

    <div class="header-title">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:28px; height:28px; color:#2563eb;"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M9 9.563C9 9.252 9.252 9 9.563 9h4.874c.311 0 .563.252.563.563v4.874c0 .311-.252.563-.563.563H9.564A.562.562 0 019 14.437V9.564z" /></svg>
        NONNON STORE
    </div>

    <div class="main-container">
        <!-- รูปภาพโลโก้ -->
        <div class="card-img">
            <img src="ไม่มีชื่อ 122_20260310104519.jpeg" onerror="this.src='https://placehold.co/600x600/f0f7ff/2563eb?text=NONNON+STORE'">
        </div>

        <div class="card-content">
            <div class="status-bar">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:20px; height:20px;"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                <span>ยินดีต้อนรับเข้าสู่ช่องทางชำระเงินค่ะ 💙</span>
            </div>

            <p style="margin: 0 0 20px 0; font-weight: 500; font-size: 14px; line-height: 1.6; color: #475569;">
                ตรวจสอบยอดและเลขบัญชีก่อนโอนทุกครั้งนะคะ <br>
                โอนแล้วส่งสลิปแจ้งทางแชทได้เลยน้า ☁️️✨
            </p>

            <!-- พื้นที่แสดงช่องทางการโอน (ดึงข้อมูลอัตโนมัติ) -->
            <div id="bankListContainer"></div>

            <!-- ปุ่มช่องทางติดต่อ -->
            <div class="social-section">
                <a href="https://lin.ee/NNKqu9g" target="_blank" class="social-btn btn-line">LINE</a>
                <a href="https://www.facebook.com/share/19fLAacTiP/" target="_blank" class="social-btn btn-fb">Facebook</a>
                <a href="https://www.instagram.com/nonnon_store06?stkn=MXV2ZHJhdGF6MHF1aQ==" target="_blank" class="social-btn btn-ig">Instagram</a>
            </div>

            <div class="footer-note">
                ขอบคุณที่อุดหนุนนะคะ 💙<br>
                <b>NONNON STORE</b>
            </div>

            <!-- ปุ่มเปิด/ปิด แผงหลังบ้าน -->
            <button class="admin-toggle-btn" onclick="toggleAdminPanel()">⚙️ จัดการช่องทางชำระเงิน (หลังบ้าน)</button>

            <!-- แผงหลังบ้านสำหรับเพิ่ม/ปิด-เปิดช่องทาง -->
            <div id="adminPanel" class="admin-panel">
                <h3>🛠️ ระบบจัดการแอดมิน</h3>
                
                <div style="font-size: 12px; font-weight: bold; color: #334155; margin-bottom: 6px;">รายการช่องทางปัจจุบัน:</div>
                <div id="adminBankList"></div>

                <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 15px 0;">

                <div style="font-size: 12px; font-weight: bold; color: #334155; margin-bottom: 6px;">➕ เพิ่มช่องทางใหม่:</div>
                <div class="form-group">
                    <label>ชื่อย่อไอคอน (เช่น KTB, SCB, TW):</label>
                    <input type="text" id="newLogo" placeholder="เช่น KTB">
                </div>
                <div class="form-group">
                    <label>ชื่อช่องทาง (เช่น ธนาคารกรุงไทย (วรรณภา)):</label>
                    <input type="text" id="newName" placeholder="เช่น ธนาคารกรุงไทย">
                </div>
                <div class="form-group">
                    <label>เลขบัญชี / เบอร์วอเลท:</label>
                    <input type="text" id="newNumber" placeholder="เช่น 9630508281">
                </div>
                <button class="btn-save-add" onclick="addNewBank()">เพิ่มช่องทางนี้</button>
            </div>
        </div>
    </div>

    <script>
        /* ข้อมูลเริ่มต้น (ถ้ายังไม่เคยบันทึกในเครื่อง) */
        const defaultBanks = [
            { id: 1, logo: 'KTB', name: 'ธนาคารกรุงไทย', number: '9630508281', active: true, color: '#2563eb', bg: '#eff6ff' },
            { id: 2, logo: 'TW', name: 'TrueMoney Wallet', number: '0640133351', active: true, color: '#f97316', bg: '#fff7ed' }
        ];

        // โหลดข้อมูลจาก LocalStorage หรือใช้ค่าเริ่มต้น
        let banks = JSON.parse(localStorage.getItem('nonnon_banks')) || defaultBanks;

        function saveAndRender() {
            localStorage.setItem('nonnon_banks', JSON.stringify(banks));
            renderUserView();
            renderAdminView();
        }

        // แสดงผลหน้าเว็บหลักของลูกค้า
        function renderUserView() {
            const container = document.getElementById('bankListContainer');
            container.innerHTML = '';

            banks.forEach(bank => {
                if (bank.active) {
                    container.innerHTML += `
                        <div class="bank-row">
                            <div class="bank-info">
                                <div class="bank-logo" style="background: ${bank.bg || '#eff6ff'}; color: ${bank.color || '#2563eb'};">${bank.logo}</div>
                                <div>
                                    <div style="font-size: 11px; color: #64748b;">${bank.name}</div>
                                    <div style="font-weight: bold; color: #1e293b; font-size: 15px;">${bank.number}</div>
                                </div>
                            </div>
                            <button class="btn-copy" onclick="copyText('${bank.number}', this)">คัดลอก</button>
                        </div>
                    `;
                }
            });
        }

        // แสดงผลหลังบ้าน (จัดการ เปิด/ปิด และ ลบ)
        function renderAdminView() {
            const adminList = document.getElementById('adminBankList');
            adminList.innerHTML = '';

            banks.forEach((bank, index) => {
                adminList.innerHTML += `
                    <div class="admin-item-row">
                        <div>
                            <b>[${bank.logo}]</b> ${bank.name} (${bank.number})
                        </div>
                        <div>
                            <button class="btn-action btn-toggle ${bank.active ? '' : 'closed'}" onclick="toggleBankStatus(${index})">
                                ${bank.active ? 'เปิดอยู่ (ปิด)' : 'ปิดอยู่ (เปิด)'}
                            </button>
                            <button class="btn-action btn-del" onclick="deleteBank(${index})">ลบ</button>
                        </div>
                    </div>
                `;
            });
        }

        // สลับสถานะ เปิด/ปิด
        function toggleBankStatus(index) {
            banks[index].active = !banks[index].active;
            saveAndRender();
            showToast('เปลี่ยนสถานะสำเร็จ ✨');
        }

        // ลบช่องทาง
        function deleteBank(index) {
            if(confirm('ต้องการลบช่องทางนี้ใช่ไหมคะ?')) {
                banks.splice(index, 1);
                saveAndRender();
                showToast('ลบข้อมูลสำเร็จ ✨');
            }
        }

        // เพิ่มช่องทางใหม่
        function addNewBank() {
            const logo = document.getElementById('newLogo').value.trim();
            const name = document.getElementById('newName').value.trim();
            const number = document.getElementById('newNumber').value.trim();

            if (!logo || !name || !number) {
                alert('กรุณากรอกข้อมูลให้ครบถ้วนด้วยนะคะ!');
                return;
            }

            banks.push({
                id: Date.now(),
                logo: logo,
                name: name,
                number: number,
                active: true,
                color: '#2563eb',
                bg: '#eff6ff'
            });

            document.getElementById('newLogo').value = '';
            document.getElementById('newName').value = '';
            document.getElementById('newNumber').value = '';

            saveAndRender();
            showToast('เพิ่มช่องทางใหม่สำเร็จ ✨');
        }

        // เปิด/ปิดแผงหลังบ้าน
        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        // แจ้งเตือน Toast
        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.innerText = text;
            toast.style.top = '25px';
            setTimeout(() => {
                toast.style.top = '-60px';
            }, 2000);
        }

        // ฟังก์ชันคัดลอกข้อความ
        function copyText(text, btn) {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            const originalText = btn.innerText;
            btn.innerText = '✔';
            btn.style.animation = 'none';
            showToast('คัดลอกสำเร็จ ✨');
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.animation = 'buttonWobble 2s infinite ease-in-out';
            }, 2000);
        }

        // เริ่มต้นรันหน้าเว็บ
        renderUserView();
        renderAdminView();

        // อิโมจิลอยน่ารักๆ
        const emojis = ['💙', '✨', '☁️️', '💫', '🩵'];
        setInterval(() => {
            const emoji = document.createElement('div');
            emoji.classList.add('emoji-fly');
            emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            emoji.style.left = Math.random() * 100 + 'vw';
            emoji.style.fontSize = Math.random() * 18 + 18 + 'px';
            emoji.style.animationDuration = Math.random() * 4 + 4 + 's';
            document.body.appendChild(emoji);
            setTimeout(() => emoji.remove(), 8000);
        }, 500);
    </script>
</body>
</html>
