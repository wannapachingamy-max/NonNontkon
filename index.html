<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NONNON STORE - ช่องทางชำระเงิน</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            margin: 0;
            padding: 40px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #334155;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            background-color: #f0f7ff;
            background-image: 
                radial-gradient(#bae6fd 1.5px, transparent 1.5px),
                radial-gradient(#e0f2fe 0.5px, transparent 0.5px);
            background-size: 50px 50px, 100px 100px;
        }

        /* --- ดาว/ประกายวิบวับสไตล์มินิมอล --- */
        .star {
            position: absolute;
            top: -100px;
            width: 2px;
            height: 100px;
            background: linear-gradient(180deg, transparent, #38bdf8);
            animation: shootingStar linear infinite;
            opacity: 0;
            z-index: 0;
        }
        @keyframes shootingStar {
            0% { transform: translateY(0) translateX(0) rotate(-45deg); opacity: 0; }
            10% { opacity: 0.7; }
            100% { transform: translateY(120vh) translateX(-120vh) rotate(-45deg); opacity: 0; }
        }
        .star:nth-child(1) { left: 15%; animation-duration: 4s; animation-delay: 0s; }
        .star:nth-child(2) { left: 35%; animation-duration: 6s; animation-delay: 1s; }
        .star:nth-child(3) { left: 55%; animation-duration: 3.5s; animation-delay: 2.5s; }
        .star:nth-child(4) { left: 75%; animation-duration: 5s; animation-delay: 0.5s; }

        /* --- แอนิเมชันปุ่มสั่น (Wobble) --- */
        @keyframes buttonWobble {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(2deg) scale(1.03); }
            50% { transform: rotate(-2deg) scale(1.03); }
            75% { transform: rotate(2deg) scale(1.03); }
            100% { transform: rotate(0deg) scale(1); }
        }

        /* ปุ่มคัดลอก */
        .btn-copy {
            background-color: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 #bfdbfe;
            position: relative;
            top: 0;
            transition: 0.1s;
            animation: buttonWobble 2s infinite ease-in-out;
        }
        .btn-copy:active { top: 3px; box-shadow: none; animation: none; }

        /* --- อิโมจิลอยฟุ้งน่ารักๆ --- */
        .emoji-fly {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            opacity: 0.6;
            animation: emojiFloat linear infinite;
        }
        @keyframes emojiFloat {
            0% { transform: translateY(110vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(-10vh) translateX(50px) rotate(360deg); opacity: 0; }
        }

        /* --- Layout --- */
        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: bold;
            color: #1e40af;
            text-transform: uppercase;
            position: relative;
            z-index: 10;
        }

        .main-container {
            max-width: 400px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .card-img {
            background: rgba(255, 255, 255, 0.9);
            padding: 12px;
            border-radius: 28px;
            border: 2px solid #bae6fd;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.15);
            margin-bottom: 20px;
        }
        .card-img img { width: 100%; border-radius: 18px; display: block; }

        .card-content {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 20px;
            border-radius: 28px;
            border: 2px solid #bae6fd;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.15);
            text-align: center;
        }

        .status-bar {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 16px;
            padding: 12px;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            color: #16a34a;
        }

        .bank-row {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            transition: transform 0.2s;
        }
        .bank-row:hover {
            border-color: #93c5fd;
            background: #fff;
        }

        .bank-info { display: flex; align-items: center; gap: 14px; text-align: left; }
        .bank-logo { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid #e2e8f0; font-size: 14px; }

        /* ส่วนช่องทางติดต่อโซเชียล */
        .social-section {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        .social-btn {
            flex: 1;
            padding: 10px 0;
            border-radius: 14px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: 0.2s;
        }
        .social-btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-line { background-color: #06c755; }
        .btn-fb { background-color: #1877f2; }
        .btn-ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }

        .footer-note {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #cbd5e1;
            font-size: 11px;
            color: #64748b;
            line-height: 1.6;
        }

        #toast {
            position: fixed;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: #2563eb;
            color: white;
            padding: 12px 28px;
            border-radius: 999px;
            transition: top 0.4s;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div>

    <div id="toast">คัดลอกสำเร็จ ✨</div>

    <div class="header-title">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:28px; height:28px; color:#2563eb;"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M9 9.563C9 9.252 9.252 9 9.563 9h4.874c.311 0 .563.252.563.563v4.874c0 .311-.252.563-.563.563H9.564A.562.562 0 019 14.437V9.564z" /></svg>
        NONNON STORE
    </div>

    <div class="main-container">
        <!-- รูปภาพโลโก้ / รูปบนสุด -->
        <div class="card-img">
            <img src="ไม่มีชื่อ 122_20260310104519.jpeg" onerror="this.src='https://placehold.co/600x600/f0f7ff/2563eb?text=NONNON+STORE'">
        </div>

        <div class="card-content">
            <div class="status-bar">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:20px; height:20px;"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                <span>ยินดีต้อนรับเข้าสู่ช่องทางชำระเงินค่ะ 💙</span>
            </div>

            <p style="margin: 0 0 20px 0; font-weight: 500; font-size: 14px; line-height: 1.6; color: #475569;">
                ตรวจสอบยอดและเลขบัญชีก่อนโอนทุกครั้งนะคะ <br>
                โอนแล้วส่งสลิปแจ้งทางแชทได้เลยน้า ☁️✨
            </p>

            <!-- ช่องทางที่ 1: ธนาคารกรุงไทย -->
            <div class="bank-row">
                <div class="bank-info">
                    <div class="bank-logo" style="background: #eff6ff; color: #2563eb;">KTB</div>
                    <div>
                        <div style="font-size: 11px; color: #64748b;">ธนาคารกรุงไทย</div>
                        <div style="font-weight: bold; color: #1e293b; font-size: 15px;">9630508281</div>
                    </div>
                </div>
                <button class="btn-copy" onclick="copyText('9630508281', this)">คัดลอก</button>
            </div>

            <!-- ช่องทางที่ 2: วอเลท -->
            <div class="bank-row">
                <div class="bank-info">
                    <div class="bank-logo" style="background: #fff7ed; color: #f97316;">TW</div>
                    <div>
                        <div style="font-size: 11px; color: #64748b;">TrueMoney Wallet</div>
                        <div style="font-weight: bold; color: #1e293b; font-size: 15px;">0640133351</div>
                    </div>
                </div>
                <button class="btn-copy" onclick="copyText('0640133351', this)">คัดลอก</button>
            </div>

            <!-- ปุ่มช่องทางติดต่อ -->
            <div class="social-section">
                <a href="https://lin.ee/NNKqu9g" target="_blank" class="social-btn btn-line">LINE</a>
                <a href="https://www.facebook.com/share/19fLAacTiP/" target="_blank" class="social-btn btn-fb">Facebook</a>
                <a href="https://www.instagram.com/nonnon_store06?stkn=MXV2ZHJhdGF6MHF1aQ==" target="_blank" class="social-btn btn-ig">Instagram</a>
            </div>

            <div class="footer-note">
                ขอบคุณที่อุดหนุนนะคะ 💙<br>
                <b>NONNON STORE</b>
            </div>
        </div>
    </div>

    <script>
        /* อิโมจิลอยน่ารักๆ เปลี่ยนเป็นแนวฟ้าขาว/หัวใจ/ดาว */
        const emojis = ['💙', '✨', '☁️', '💫', '🩵'];
        setInterval(() => {
            const emoji = document.createElement('div');
            emoji.classList.add('emoji-fly');
            emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            emoji.style.left = Math.random() * 100 + 'vw';
            emoji.style.fontSize = Math.random() * 18 + 18 + 'px';
            emoji.style.animationDuration = Math.random() * 4 + 4 + 's';
            document.body.appendChild(emoji);
            setTimeout(() => emoji.remove(), 8000);
        }, 500);

        function copyText(text, btn) {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            const toast = document.getElementById('toast');
            toast.style.top = '25px';
            const originalText = btn.innerText;
            btn.innerText = '✔';
            btn.style.animation = 'none';
            
            setTimeout(() => {
                toast.style.top = '-60px';
                btn.innerText = originalText;
                btn.style.animation = 'buttonWobble 2s infinite ease-in-out';
            }, 2000);
        }
    </script>
</body>
</html>
