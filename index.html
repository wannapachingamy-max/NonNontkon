<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonnon Store - ช่องทางการชำระเงิน</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    },
                    colors: {
                        cute: {
                            50: '#e0f2fe',
                            100: '#bae6fd',
                            200: '#7dd3fc',
                            300: '#38bdf8',
                            400: '#0ea5e9',
                            500: '#0284c7',
                            600: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            /* โทนสีน้ำเงิน-ฟ้าสว่างสดใสตามเรฟอ้างอิง เติมแสงขาวสะท้อน */
            background-color: #0b4a82; 
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #0ea5e9; }
        
        @keyframes slideDown {
            from { transform: translateY(-15px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeInScale {
            from { transform: scale(0.97); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        /* วงกลมพื้นหลังลอยสมูทๆ เติมแสงขาวสะท้อนให้สว่างขึ้น */
        @keyframes float-bg-1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(35px, 60px) scale(1.08); }
            66% { transform: translate(-25px, 45px) scale(0.92); }
        }
        @keyframes float-bg-2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-45px, -55px) scale(1.12); }
            66% { transform: translate(25px, -35px) scale(0.94); }
        }
        @keyframes float-bg-3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(55px, -35px) scale(1.1); }
        }

        /* เอฟเฟกต์แสงเงาวิ่งพาดกล่องชำระเงิน */
        @keyframes shimmer-sweep {
            0% { transform: translateX(-150%) skewX(-20deg); }
            100% { transform: translateX(250%) skewX(-20deg); }
        }

        /* อนิเมชันเด้งดึ๋ง (Bounce In) สำหรับบล็อก */
        @keyframes bounceIn {
            0% { transform: translateY(30px) scale(0.9); opacity: 0; }
            50% { transform: translateY(-5px) scale(1.02); opacity: 1; }
            75% { transform: translateY(2px) scale(0.98); opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .animate-bounce-in {
            animation: bounceIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* อนิเมชันเปลี่ยนหน้าแบบสมูทและนุ่มนวล */
        .page-transition {
            animation: fadeInScale 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* อนิเมชันอีโมจิลอยฟุ้ง (Floating Emojis) */
        @keyframes float-emoji-1 {
            0% { transform: translateY(100vh) translateX(0px) rotate(0deg) scale(0.8); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-20vh) translateX(40px) rotate(45deg) scale(1.1); opacity: 0; }
        }
        @keyframes float-emoji-2 {
            0% { transform: translateY(100vh) translateX(0px) rotate(0deg) scale(1); opacity: 0; }
            20% { opacity: 0.7; transform: translateY(60vh) translateX(-30px) rotate(-15deg); }
            80% { opacity: 0.7; }
            100% { transform: translateY(-20vh) translateX(20px) rotate(20deg) scale(0.9); opacity: 0; }
        }
        .floating-emoji {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            user-select: none;
            filter: drop-shadow(0 4px 12px rgba(255,255,255,0.6));
        }

        /* พื้นหลังสายน้ำ (Liquid Water) ขนาดเล็กและเตี้ย */
        .liquid-water {
            position: absolute;
            bottom: -450px;
            left: 50%;
            width: 600px;
            height: 600px;
            background: rgba(125, 211, 252, 0.25);
            border-radius: 43%;
            transform: translateX(-50%);
            animation: spin-water 12s linear infinite;
            z-index: 0;
            pointer-events: none;
        }
        .liquid-water:nth-child(2) {
            bottom: -465px;
            background: rgba(56, 189, 248, 0.18); 
            animation: spin-water 16s linear infinite reverse;
        }
        .liquid-water:nth-child(3) {
            bottom: -480px;
            background: rgba(255, 255, 255, 0.15); 
            animation: spin-water 10s linear infinite;
        }
        @keyframes spin-water { 
            0% { transform: translateX(-50%) rotate(0deg); }
            100% { transform: translateX(-50%) rotate(360deg); } 
        }

        /* อนิเมชันโลโก้ขยับขึ้นลงเบาๆ */
        @keyframes floatUpAndDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* ลูกเล่นไฟกระพริบ */
        @keyframes ping-slow {
            0% { transform: scale(1); opacity: 0.9; }
            80%, 100% { transform: scale(2.8); opacity: 0; }
        }
        .status-indicator {
            position: relative;
            display: inline-flex;
            border-radius: 9999px;
        }
        .status-indicator .dot {
            position: relative;
            display: inline-flex;
            border-radius: 9999px;
            background-color: #38bdf8;
        }
        .status-indicator .ping {
            position: absolute;
            display: inline-flex;
            height: 100%;
            width: 100%;
            border-radius: 9999px;
            background-color: #38bdf8;
            animation: ping-slow 2.2s cubic-bezier(0, 0, 0.2, 1) infinite;
        }

        .toast-enter {
            animation: slideDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .glass-nav {
            background: rgba(7, 74, 130, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        .upload-overlay {
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .group:hover .upload-overlay {
            opacity: 1;
        }
        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        
        .btn-disabled {
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
        }
    </style>
</head>
<body class="text-white antialiased selection:bg-cute-300 selection:text-cute-900">

    <!-- Navbar ด้านบน -->

                    <span>Nonnon Store</span>

                    <span class="status-indicator w-2 h-2 mt-0.5">

            box.classList.remove('scale-95');
            modal.classList.add('flex');
            setTimeout(() => document.getElementById('admin-email').focus(), 100);

        const attemptLogin = async () => {

            const password = document.getElementById('admin-password').value;

            if(!email || !password) {
                showToast('กรุณากรอกอีเมลและรหัสผ่าน', true);

            isProcessing = true;

                toast.classList.add('opacity-0');
                setTimeout(() => toast.classList.add('hidden'), 300);

        // ฟังก์ชันดาวน์โหลดรูปภาพผ่าน Blob รองรับมือถือและทุกเบราว์เซอร์
        window.downloadContentImage = async () => {
            const imgUrl = appData.store.contentImage;
            if(!imgUrl) {
                showToast('ไม่พบรูปภาพสำหรับดาวน์โหลด', true);
                return;
            }
            
            showToast('กำลังดาวน์โหลดรูปภาพ...');
            try {
                // ถ้าเป็น dataURL แปลงเป็น blob ตรงๆ
                let blob;
                if (imgUrl.startsWith('data:')) {
                    const arr = imgUrl.split(',');
                    const mime = arr[0].match(/:(.*?);/)[1];
                    const bstr = atob(arr[1]);
                    let n = bstr.length;
                    const u8arr = new Uint8Array(n);
                    while (n--) {
                        u8arr[n] = bstr.charCodeAt(n);
                    }
                    blob = new Blob([u8arr], { type: mime });
                } else {
                    const response = await fetch(imgUrl);
                    blob = await response.blob();
                }

                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = 'NonnonStore-QR-Payment.webp';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
                showToast('ดาวน์โหลดรูปภาพสำเร็จ 📥');
            } catch (err) {
                console.error("Download error:", err);
                // Fallback direct open/download
                const a = document.createElement('a');
                a.href = imgUrl;
                a.download = 'NonnonStore-QR-Payment.webp';
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showToast('เปิดรูปภาพสำหรับบันทึก 📥');
            }
        };

        const compressImage = (file, maxWidth, maxHeight, quality, callback) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function (event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function () {
                    let width = img.width;
                    let height = img.height;
                    if (width > height) {
                        if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                    } else {
                        if (height > maxHeight) { width = Math.round((width * maxHeight) / height); height = maxHeight; }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/webp', quality));
                };
            };
        };

            const { data, error } = await supabaseClient.from('payment_methods').insert([newPayment]).select().single();

                appData.payments.push({

                });
                render();
                showToast('เพิ่มช่องทางใหม่แล้ว');
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 100);
            }
        };

        let updateTimeoutMap = {};
        window.updatePayment = (id, field, value) => {
            const index = appData.payments.findIndex(p => p.id === id);
            if (index > -1) {
                appData.payments[index][field] = value;
                if(field === 'color' || field === 'iconImage') render(); 
            }
            if(updateTimeoutMap[id + field]) clearTimeout(updateTimeoutMap[id + field]);
            updateTimeoutMap[id + field] = setTimeout(async () => {
                const dbField = { 'bankName': 'bank_name', 'accountName': 'account_name', 'accountNo': 'account_no', 'color': 'color', 'iconImage': 'icon_image_url' }[field];

            }, 500);
        };

        window.togglePaymentStatus = async (id) => {
            const index = appData.payments.findIndex(p => p.id === id);
            if (index > -1) {
                const newStatus = !appData.payments[index].isActive;
                appData.payments[index].isActive = newStatus;

                const { error } = await supabaseClient.from('payment_methods').update({ is_active: newStatus }).eq('id', id);

                            <img src="${escapeHTML(appData.store.logo) || 'https://placehold.co/300x300/0c4a6e/38bdf8?text=Logo'}" alt="Logo" class="w-full h-full object-cover transition-transform duration-500 hover:scale-110">

                            </div>
                            
                            <!-- ปุ่มดาวน์โหลดรูป ย้ายมาอยู่ใต้ภาพคิวอาร์เรียบร้อย -->
                            <button onclick="downloadContentImage()" class="mt-4 bg-white/90 hover:bg-white text-slate-950 px-6 py-3 rounded-2xl shadow-xl flex items-center space-x-2.5 text-sm font-bold border border-white/40 transition-all duration-300 active:scale-95 group/dl">
                                <div class="transition-transform group-hover/dl:-translate-y-0.5 text-sky-600">${icons.download}</div>
                                <span>บันทึกรูปคิวอาร์</span>
                            </button>
                        </div>
                        ` : ''}
                    </div>

                    <div class="w-full px-5 mt-10 space-y-6 flex-1 stagger-3">
                        <div class="flex items-center justify-center mb-6">
                            <div class="h-[2px] bg-gradient-to-r from-transparent to-white flex-1 rounded-full opacity-65"></div>
                            <h2 class="px-5 text-center font-bold text-white text-[15px] tracking-widest bg-slate-900/60 backdrop-blur-sm py-2 rounded-full border border-white/35 uppercase shadow-md">ช่องทางการชำระเงิน</h2>
                            <div class="h-[2px] bg-gradient-to-l from-transparent to-white flex-1 rounded-full opacity-65"></div>
                        </div>
                        <div class="space-y-5">
                            ${paymentsHTML}
                        </div>
                    </div>

                    <div class="mt-12 pt-4 w-full flex justify-center space-x-6 relative z-10">
                        <a href="${escapeHTML(socialLinks.line)}" target="_blank" class="w-14 h-14 bg-white text-[#00B900] rounded-full flex items-center justify-center shadow-[0_8px_25px_rgb(0,185,0,0.4)] hover:shadow-[0_12px_30px_rgb(0,185,0,0.6)] border-2 border-white/50 hover:-translate-y-2 transition-all duration-300">
                            ${icons.line}
                        </a>
                        <a href="${escapeHTML(socialLinks.facebook)}" target="_blank" class="w-14 h-14 bg-white text-[#1877F2] rounded-full flex items-center justify-center shadow-[0_8px_25px_rgb(24,119,242,0.4)] hover:shadow-[0_12px_30px_rgb(24,119,242,0.6)] border-2 border-white/50 hover:-translate-y-2 transition-all duration-300">
                            ${icons.facebook}
                        </a>
                        <a href="${escapeHTML(socialLinks.instagram)}" target="_blank" class="w-14 h-14 bg-white text-[#E1306C] rounded-full flex items-center justify-center shadow-[0_8px_25px_rgb(225,48,108,0.4)] hover:shadow-[0_12px_30px_rgb(225,48,108,0.6)] border-2 border-white/50 hover:-translate-y-2 transition-all duration-300">
                            ${icons.instagram}
                        </a>
                    </div>
                </div>
            `;
        };

        const renderAdminView = () => {
            let paymentsAdminHTML = '';
            
            appData.payments.forEach((p, index) => {
                const iconPreview = p.iconImage
                    ? `<img src="${escapeHTML(p.iconImage)}" class="w-full h-full object-contain p-1 relative z-10" alt="icon">`
                    : `<div class="scale-75 text-white">${icons.bank}</div>`;

                paymentsAdminHTML += `
                    <div class="bg-slate-900 border-[3px] border-slate-800 rounded-[28px] p-5 space-y-4 shadow-xl relative hover:border-cute-400/50 transition-colors">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-[12px] flex items-center justify-center text-white shadow-inner bg-slate-800 overflow-hidden relative" style="${p.color ? `background-color: ${escapeHTML(p.color)};` : ''}">
                                    ${iconPreview}
                                </div>
                                <span class="font-bold text-white text-[15px]">ช่องทางที่ ${index + 1}</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <button onclick="togglePaymentStatus('${p.id}')" class="text-[12px] font-bold px-4 py-2 rounded-xl transition-all duration-200 ${p.isActive ? 'bg-white text-slate-950 shadow-md' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}">
                                    ${p.isActive ? 'เปิดใช้งาน' : 'ปิด'}
                                </button>
                                <button onclick="openDeleteModal('payment', '${p.id}')" class="text-slate-400 hover:text-white hover:bg-red-600 p-2 rounded-xl transition-all shadow-sm border border-transparent">
                                    ${icons.trash}
                                </button>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 gap-3.5 pt-1">
                            <div>
                                <label class="block text-[13px] font-bold text-cute-100 mb-1.5 ml-1">ชื่อธนาคาร / แอปพลิเคชัน</label>
                                <input type="text" value="${escapeHTML(p.bankName)}" onchange="updatePayment('${p.id}', 'bankName', this.value)" class="w-full px-4 py-3 text-[15px] bg-slate-950/70 border-2 border-slate-800 rounded-[16px] focus:bg-slate-950 focus:border-cute-300 outline-none transition-all text-white placeholder:text-slate-600" placeholder="เช่น TrueMoney Wallet">
                            </div>
                            <div>
                                <label class="block text-[13px] font-bold text-cute-100 mb-1.5 ml-1">ชื่อบัญชี</label>
                                <input type="text" value="${escapeHTML(p.accountName)}" onchange="updatePayment('${p.id}', 'accountName', this.value)" class="w-full px-4 py-3 text-[15px] bg-slate-950/70 border-2 border-slate-800 rounded-[16px] focus:bg-slate-950 focus:border-cute-300 outline-none transition-all text-white placeholder:text-slate-600" placeholder="เช่น นายสมชาย ใจดี">
                            </div>
                            <div>
                                <label class="block text-[13px] font-bold text-cute-100 mb-1.5 ml-1">เลขบัญชี / เบอร์โทรศัพท์</label>
                                <input type="text" value="${escapeHTML(p.accountNo)}" onchange="updatePayment('${p.id}', 'accountNo', this.value)" class="w-full px-4 py-3 text-[15px] bg-slate-950/70 border-2 border-slate-800 rounded-[16px] focus:bg-slate-950 focus:border-cute-300 outline-none font-mono transition-all text-cute-200 font-bold placeholder:text-slate-600" placeholder="เช่น 081-234-5678">
                            </div>
                            
                            <div class="flex space-x-4">
                                <div class="flex-1">
                                    <label class="block text-[13px] font-bold text-cute-100 mb-1.5 ml-1">รูปไอคอน</label>
                                    <div class="flex items-center space-x-3">
                                        <div class="relative w-14 h-14 rounded-[16px] border-2 border-dashed border-cute-400/40 overflow-hidden group cursor-pointer hover:border-white transition-colors flex items-center justify-center bg-slate-950/70" onclick="triggerPaymentIconUpload('${p.id}')">
                                            ${p.iconImage ? `<img src="${escapeHTML(p.iconImage)}" class="w-full h-full object-contain p-1">` : `<div class="scale-75 text-cute-200">${icons.camera}</div>`}
                                            <div class="absolute inset-0 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center upload-overlay">
                                                <div class="text-white scale-[0.6]">${icons.camera}</div>
                                            </div>
                                        </div>
                                        ${p.iconImage ? `<button onclick="updatePayment('${p.id}', 'iconImage', '')" class="text-[12px] text-slate-400 hover:text-red-400 underline decoration-dotted">ลบรูป</button>` : ''}
                                    </div>
                                </div>
                                <div class="flex-1">
                                    <label class="block text-[13px] font-bold text-cute-100 mb-1.5 ml-1">สีพื้นหลังไอคอน</label>
                                    <div class="flex items-center space-x-2">
                                        <input type="color" value="${escapeHTML(p.color)}" onchange="updatePayment('${p.id}', 'color', this.value)" class="w-14 h-14 p-1 border-2 border-slate-800 rounded-[16px] cursor-pointer bg-slate-950 overflow-hidden flex-shrink-0">
                                        <input type="text" value="${escapeHTML(p.color)}" onchange="updatePayment('${p.id}', 'color', this.value)" class="w-full px-3 py-3 text-[13px] bg-slate-950/70 border-2 border-slate-800 rounded-[16px] focus:bg-slate-950 focus:border-cute-300 outline-none font-mono uppercase text-white transition-all">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            return `
                <div class="p-5 bg-transparent w-full animate-[slideDown_0.3s_ease-out] relative z-10 text-white">
                    <div class="mb-8 pt-4 px-2 flex justify-between items-start">
                        <div>
                            <h1 class="text-[24px] font-bold text-white flex items-center space-x-2">
                                <span class="text-cute-200">⚙️</span>
                                <span>ตั้งค่าร้านค้า</span>
                            </h1>
                            <p class="text-[14px] text-slate-300 mt-2">จัดการข้อมูลและรูปภาพ บันทึกอัตโนมัติ 💙</p>
                        </div>
                        <button onclick="logout()" class="px-4 py-2.5 bg-red-500/20 text-red-300 rounded-xl text-[13px] font-bold hover:bg-red-500 hover:text-white transition-colors flex items-center space-x-1 shadow-sm border border-red-500/30">
                            <span>ออกจากระบบ</span>
                        </button>
                    </div>

                    <div class="mb-10 space-y-5">
                        <div class="flex items-center space-x-2 px-2">
                            <div class="w-2.5 h-6 bg-white rounded-full"></div>
                            <h2 class="text-[16px] font-bold text-white">รูปภาพและข้อความ</h2>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div class="flex flex-col items-center space-y-3 p-5 bg-slate-900 rounded-[28px] shadow-xl border-[3px] border-slate-800 hover:border-cute-400/40 transition-colors">
                                <label class="block text-[12px] font-bold text-cute-100 w-full text-center">โลโก้ร้าน (PNG/JPG)</label>
                                <div class="relative w-[90px] h-[90px] rounded-full border-[3px] border-dashed border-cute-400/40 overflow-hidden group cursor-pointer hover:border-white transition-colors bg-slate-950/70" onclick="triggerUpload('upload-logo')">
                                    ${appData.store.logo ? `<img src="${escapeHTML(appData.store.logo)}" alt="Logo Preview" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center scale-75 text-cute-200">${icons.camera}</div>`}
                                    <div class="absolute inset-0 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center upload-overlay">
                                        <div class="text-white scale-75">${icons.camera}</div>
                                    </div>
                                </div>
                                ${appData.store.logo ? `<button onclick="openDeleteModal('logo')" class="text-[12px] text-slate-400 hover:text-red-400 underline decoration-dotted mt-1">ลบรูปนี้</button>` : ''}
                            </div>

                            <div class="flex flex-col items-center space-y-3 p-5 bg-slate-900 rounded-[28px] shadow-xl border-[3px] border-slate-800 hover:border-cute-400/40 transition-colors">
                                <label class="block text-[12px] font-bold text-cute-100 w-full text-center">รูป QR / ภาพประกอบ</label>
                                <div class="relative w-full h-[90px] rounded-[20px] border-[3px] border-dashed border-cute-400/40 overflow-hidden group cursor-pointer hover:border-white transition-colors bg-slate-950/70" onclick="triggerUpload('upload-content')">
                                    ${appData.store.contentImage ? `<img src="${escapeHTML(appData.store.contentImage)}" alt="Content Preview" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center scale-75 text-cute-200">${icons.camera}</div>`}
                                    <div class="absolute inset-0 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center upload-overlay">
                                        <div class="text-white scale-75">${icons.camera}</div>
                                    </div>
                                </div>
                                ${appData.store.contentImage ? `<button onclick="openDeleteModal('content')" class="text-[12px] text-slate-400 hover:text-red-400 underline decoration-dotted mt-1">ลบรูปนี้</button>` : ''}
                            </div>
                        </div>

                        <div class="bg-slate-900 p-2 rounded-[28px] shadow-xl border-[3px] border-slate-800">
                            <textarea rows="3" onchange="updateStoreText('tagline', this.value)" placeholder="คำโปรย หรือข้อความต้อนรับ..." class="w-full px-5 py-4 text-[15px] bg-transparent rounded-xl focus:bg-slate-950/40 outline-none resize-none transition-colors text-white leading-relaxed">${escapeHTML(appData.store.tagline)}</textarea>
                        </div>
                    </div>

                    <div class="space-y-5 pb-8">
                        <div class="flex justify-between items-center px-2">
                            <div class="flex items-center space-x-2">
                                <div class="w-2.5 h-6 bg-white rounded-full"></div>
                                <h2 class="text-[16px] font-bold text-white">ช่องทางรับเงิน</h2>
                            </div>
                            <button onclick="addPaymentMethod()" class="text-[13px] font-bold bg-white hover:bg-cute-100 text-slate-950 px-5 py-2.5 rounded-[14px] transition-all shadow-[0_4px_14px_0_rgba(255,255,255,0.4)] hover:shadow-[0_6px_20px_rgba(255,255,255,0.25)] hover:-translate-y-0.5 active:translate-y-0 flex items-center space-x-1">
                                <span>+ เพิ่มช่องทาง</span>
                            </button>
                        </div>

                        <div class="space-y-5">
                            ${paymentsAdminHTML}
                            ${appData.payments.length === 0 ? '<div class="text-center text-slate-400 py-10 bg-slate-900 backdrop-blur-sm rounded-[28px] border-[3px] border-dashed border-slate-800 font-medium text-[15px]">ยังไม่มีข้อมูล กรุณาเพิ่มช่องทาง</div>' : ''}
                        </div>
                    </div>
                </div>
            `;
        };

        const render = () => {
            const container = document.getElementById('content-container');
            
            if (isFetching) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-screen space-y-4 animate-[floatUp_0.3s_ease-out]">
                        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-white"></div>
                        <span class="text-cute-100 font-medium text-[15px]">กำลังโหลดข้อมูล...</span>
                    </div>
                `;
                return;
            }

            if (fetchError) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-screen space-y-4 text-center px-6 animate-[floatUp_0.3s_ease-out]">
                        <div class="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center text-red-400 mb-2 shadow-sm ring-2 ring-red-500/30">
                            <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <span class="text-red-400 font-bold text-[18px]">เกิดข้อผิดพลาด</span>
                        <span class="text-slate-300 text-[14px] leading-relaxed">${escapeHTML(fetchError)}</span>
                        <button onclick="loadDataFromDB()" class="mt-4 px-8 py-3 bg-white hover:bg-cute-100 text-slate-950 font-bold text-[15px] rounded-full shadow-md transition-colors">ลองใหม่อีกครั้ง</button>
                    </div>
                `;
                return;
            }

            if (currentView === 'public') container.innerHTML = renderPublicView();
            else container.innerHTML = renderAdminView();
        };

        window.onload = async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                const { data: isAdmin } = await supabaseClient.rpc('is_admin');
                if (isAdmin) isLoggedIn = true;
            }
            loadDataFromDB();
        };
    </script>
</body>
</html>
