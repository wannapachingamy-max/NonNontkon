    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    },
                    colors: {
                        cute: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #dbeafe;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #93c5fd; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #60a5fa; }
        
        @keyframes slideDown {
            from { transform: translate(-50%, -100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        @keyframes floatUp {
            from { transform: translateY(15px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        /* ลูกเล่นวงกลมพื้นหลังลอยสมูทๆ */
        @keyframes float-bg-1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, 60px) scale(1.05); }
            66% { transform: translate(-20px, 40px) scale(0.95); }
        }
        @keyframes float-bg-2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-40px, -50px) scale(1.1); }
            66% { transform: translate(20px, -30px) scale(0.95); }
        }
        @keyframes float-bg-3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, -30px) scale(1.1); }
        }

        /* เอฟเฟกต์แสงเงาวิ่งพาดกล่องชำระเงิน */
        @keyframes shimmer-sweep {
            0% { transform: translateX(-150%) skewX(-20deg); }
            100% { transform: translateX(250%) skewX(-20deg); }
        }

        /* อนิเมชันเด้งดึ๋ง (Bounce In) สำหรับบล็อก */
        @keyframes bounceIn {
            0% { transform: translateY(30px) scale(0.9); opacity: 0; }
            50% { transform: translateY(-5px) scale(1.02); opacity: 1; }
            75% { transform: translateY(2px) scale(0.98); opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .animate-bounce-in {
            animation: bounceIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* อนิเมชันอีโมจิลอยฟุ้ง (Floating Emojis) */
        @keyframes float-emoji-1 {
            0% { transform: translateY(100vh) translateX(0px) rotate(0deg) scale(0.8); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-20vh) translateX(40px) rotate(45deg) scale(1.1); opacity: 0; }
        }
        @keyframes float-emoji-2 {
            0% { transform: translateY(100vh) translateX(0px) rotate(0deg) scale(1); opacity: 0; }
            20% { opacity: 0.5; transform: translateY(60vh) translateX(-30px) rotate(-15deg); }
            80% { opacity: 0.5; }
            100% { transform: translateY(-20vh) translateX(20px) rotate(20deg) scale(0.9); opacity: 0; }
        }
        .floating-emoji {
            position: absolute;
            pointer-events: none; /* ป้องกันไม่ให้บังการกดปุ่ม */
            z-index: 1;
            user-select: none;
            filter: drop-shadow(0 4px 6px rgba(59,130,246,0.1));
        }

        /* พื้นหลังสายน้ำ (Liquid Water) ลื่นไหล (ปรับขนาดเล็กลงและเตี้ยลง) */
        .liquid-water {
            position: absolute;
            bottom: -450px; /* กดลงไปต่ำๆ ให้โผล่มาแค่ส่วนปลายคลื่น */
            left: 50%;
            width: 600px;   /* กว้างพอดีกับกล่องคอนเทนเนอร์เพื่อให้สมูท */
            height: 600px;
            background: rgba(147, 197, 253, 0.25); /* สีน้ำฟ้าอ่อนใสๆ */
            border-radius: 43%;
            transform: translateX(-50%);
            animation: spin-water 12s linear infinite;
            z-index: 0;
            pointer-events: none;
        }
        .liquid-water:nth-child(2) {
            bottom: -465px;
            background: rgba(96, 165, 250, 0.15); 
            animation: spin-water 16s linear infinite reverse;
        }
        .liquid-water:nth-child(3) {
            bottom: -480px;
            background: rgba(191, 219, 254, 0.35); 
            animation: spin-water 10s linear infinite;
        }
        @keyframes spin-water { 
            0% { transform: translateX(-50%) rotate(0deg); }
            100% { transform: translateX(-50%) rotate(360deg); } 
        }

        /* อนิเมชันโลโก้ขยับขึ้นลงเบาๆ */
        @keyframes floatUpAndDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* ลูกเล่นไฟกระพริบ */
        @keyframes ping-slow {
            0% { transform: scale(1); opacity: 0.8; }
            80%, 100% { transform: scale(2.5); opacity: 0; }
        }
        .status-indicator {
            position: relative;
            display: inline-flex;
            border-radius: 9999px;
        }
        .status-indicator .dot {
            position: relative;
            display: inline-flex;
            border-radius: 9999px;
            background-color: #10B981;
        }
        .status-indicator .ping {
            position: absolute;
            display: inline-flex;
            height: 100%;
            width: 100%;
            border-radius: 9999px;
            background-color: #10B981;
            animation: ping-slow 2.5s cubic-bezier(0, 0, 0.2, 1) infinite;
        }

        .toast-enter {
            animation: slideDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .upload-overlay {
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .group:hover .upload-overlay {
            opacity: 1;
        }
        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        
        .btn-disabled {
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
        }
    </style>
</head>

                if (storeErr && storeErr.code !== 'PGRST116') throw storeErr;

                    appData.store.contentImage = storeData.content_image_url || "";
                    appData.store.tagline = storeData.tagline || "";

                const { data: payData, error: payErr } = await supabaseClient.from('payment_methods').select('*').order('created_at', { ascending: true });
                if (payErr) throw payErr;

                appData.payments = payData ? payData.map(p => ({
                    id: p.id, bankName: p.bank_name || '', accountName: p.account_name || '',
                    accountNo: p.account_no || '', color: p.color || '#60a5fa', iconImage: p.icon_image_url || '', isActive: p.is_active
                })) : [];

            } catch (err) {
                console.error("Data loading error:", err);
                fetchError = "ไม่สามารถเชื่อมต่อฐานข้อมูลได้ กรุณาลองใหม่อีกครั้ง";

            }

        const switchView = async (view) => {
            if (view === 'admin') {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) {

                    return;

                const { data: isAdmin, error } = await supabaseClient.rpc('is_admin');

                    showToast('บัญชีนี้ไม่มีสิทธิ์เข้าถึงระบบแอดมิน', true);

            } else {
                btnAdmin.className = "px-4 py-1.5 text-[13px] font-semibold rounded-full bg-white text-cute-600 shadow-sm transition-all duration-300";
                btnPublic.className = "px-4 py-1.5 text-[13px] font-medium rounded-full text-cute-500 hover:text-cute-700 transition-all duration-300";

            box.classList.remove('scale-95');

            const box = document.getElementById('login-box');

            if(isProcessing) return;
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            const btn = document.getElementById('btn-login-submit');

            if(!email || !password) {
                showToast('กรุณากรอกอีเมลและรหัสผ่าน', true);
                return;
            }

            isProcessing = true;
            btn.classList.add('btn-disabled');
            btn.innerText = 'กำลังตรวจสอบ...';

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            if (error) {
                showToast('อีเมลหรือรหัสผ่านไม่ถูกต้อง!', true);
                isProcessing = false;
                btn.classList.remove('btn-disabled');
                btn.innerText = 'ตกลง';
                return;
            }

            const { data: isAdmin } = await supabaseClient.rpc('is_admin');
            isProcessing = false;
            btn.classList.remove('btn-disabled');
            btn.innerText = 'ตกลง';

            if (isAdmin) {
                isLoggedIn = true;
                closeLoginModal();
                showToast('เข้าสู่ระบบสำเร็จ 💙');
                switchView('admin');
            } else {
                await supabaseClient.auth.signOut();

        const compressImage = (file, maxWidth, maxHeight, quality, callback) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function (event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function () {
                    let width = img.width;
                    let height = img.height;
                    if (width > height) {
                        if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                    } else {
                        if (height > maxHeight) { width = Math.round((width * maxHeight) / height); height = maxHeight; }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/webp', quality));
                };
            };
        };

                render();
                showToast('เพิ่มช่องทางใหม่แล้ว');

        window.updatePayment = (id, field, value) => {
            const index = appData.payments.findIndex(p => p.id === id);
            if (index > -1) {
                appData.payments[index][field] = value;
                if(field === 'color' || field === 'iconImage') render(); 
            }
            if(updateTimeoutMap[id + field]) clearTimeout(updateTimeoutMap[id + field]);
            updateTimeoutMap[id + field] = setTimeout(async () => {
                const dbField = { 'bankName': 'bank_name', 'accountName': 'account_name', 'accountNo': 'account_no', 'color': 'color', 'iconImage': 'icon_image_url' }[field];
                const { error } = await supabaseClient.from('payment_methods').update({ [dbField]: value }).eq('id', id);

                appData.payments[index].isActive = newStatus;

                                    ${p.isActive ? 'เปิดใช้งาน' : 'ปิด'}
                                </button>
                                <button onclick="openDeleteModal('payment', '${p.id}')" class="text-slate-300 hover:text-white hover:bg-red-500 p-2 rounded-xl transition-all shadow-sm border border-transparent hover:border-red-600">
                                    ${icons.trash}
                                </button>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 gap-3.5 pt-1">
                            <div>
                                <label class="block text-[13px] font-bold text-slate-500 mb-1.5 ml-1">ชื่อธนาคาร / แอปพลิเคชัน</label>
                                <input type="text" value="${escapeHTML(p.bankName)}" onchange="updatePayment('${p.id}', 'bankName', this.value)" class="w-full px-4 py-3 text-[15px] bg-cute-50/50 border-2 border-cute-100 rounded-[16px] focus:bg-white focus:border-cute-300 outline-none transition-all text-slate-800 placeholder:text-slate-300" placeholder="เช่น ธนาคารกสิกรไทย">
                            </div>
                            <div>
                                <label class="block text-[13px] font-bold text-slate-500 mb-1.5 ml-1">ชื่อบัญชี</label>
                                <input type="text" value="${escapeHTML(p.accountName)}" onchange="updatePayment('${p.id}', 'accountName', this.value)" class="w-full px-4 py-3 text-[15px] bg-cute-50/50 border-2 border-cute-100 rounded-[16px] focus:bg-white focus:border-cute-300 outline-none transition-all text-slate-800 placeholder:text-slate-300" placeholder="เช่น นายสมชาย ใจดี">
                            </div>
                            <div>
                                <label class="block text-[13px] font-bold text-slate-500 mb-1.5 ml-1">เลขบัญชี / เบอร์โทรศัพท์</label>
                                <input type="text" value="${escapeHTML(p.accountNo)}" onchange="updatePayment('${p.id}', 'accountNo', this.value)" class="w-full px-4 py-3 text-[15px] bg-cute-50/50 border-2 border-cute-100 rounded-[16px] focus:bg-white focus:border-cute-300 outline-none font-mono transition-all text-cute-700 font-bold placeholder:text-slate-300" placeholder="เช่น 123-4-56789-0">
                            </div>
                            
                            <div class="flex space-x-4">
                                <div class="flex-1">
                                    <label class="block text-[13px] font-bold text-slate-500 mb-1.5 ml-1">รูปไอคอน</label>
                                    <div class="flex items-center space-x-3">
                                        <div class="relative w-14 h-14 rounded-[16px] border-2 border-dashed border-cute-300 overflow-hidden group cursor-pointer hover:border-cute-500 transition-colors flex items-center justify-center bg-cute-50/50" onclick="triggerPaymentIconUpload('${p.id}')">
                                            ${p.iconImage ? `<img src="${escapeHTML(p.iconImage)}" class="w-full h-full object-contain p-1">` : `<div class="scale-75 text-cute-400">${icons.camera}</div>`}
                                            <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center upload-overlay">
                                                <div class="text-white scale-[0.6]">${icons.camera}</div>
                                            </div>
                                        </div>
                                        ${p.iconImage ? `<button onclick="updatePayment('${p.id}', 'iconImage', '')" class="text-[12px] text-slate-400 hover:text-red-500 underline decoration-dotted">ลบรูป</button>` : ''}
                                    </div>
                                </div>
                                <div class="flex-1">
                                    <label class="block text-[13px] font-bold text-slate-500 mb-1.5 ml-1">สีพื้นหลังไอคอน</label>
                                    <div class="flex items-center space-x-2">
                                        <input type="color" value="${escapeHTML(p.color)}" onchange="updatePayment('${p.id}', 'color', this.value)" class="w-14 h-14 p-1 border-2 border-cute-100 rounded-[16px] cursor-pointer bg-white overflow-hidden flex-shrink-0">
                                        <input type="text" value="${escapeHTML(p.color)}" onchange="updatePayment('${p.id}', 'color', this.value)" class="w-full px-3 py-3 text-[13px] bg-cute-50/50 border-2 border-cute-100 rounded-[16px] focus:bg-white focus:border-cute-300 outline-none font-mono uppercase text-slate-700 transition-all">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            return `
                <div class="p-5 bg-transparent w-full animate-[slideDown_0.3s_ease-out] relative z-10">
                    <div class="mb-8 pt-4 px-2 flex justify-between items-start">
                        <div>
                            <h1 class="text-[24px] font-bold text-slate-800 flex items-center space-x-2">
                                <span class="text-cute-500">⚙️</span>
                                <span>ตั้งค่าร้านค้า</span>
                            </h1>
                            <p class="text-[14px] text-slate-500 mt-2">จัดการข้อมูลและรูปภาพ บันทึกอัตโนมัติ 💙</p>
                        </div>
                        <button onclick="logout()" class="px-4 py-2.5 bg-red-50 text-red-500 rounded-xl text-[13px] font-bold hover:bg-red-100 hover:text-red-600 transition-colors flex items-center space-x-1 shadow-sm border border-red-100">
                            <span>ออกจากระบบ</span>
                        </button>
                    </div>

                    <div class="mb-10 space-y-5">
                        <div class="flex items-center space-x-2 px-2">
                            <div class="w-2.5 h-6 bg-cute-400 rounded-full"></div>
                            <h2 class="text-[16px] font-bold text-slate-700">รูปภาพและข้อความ</h2>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div class="flex flex-col items-center space-y-3 p-5 bg-white/90 backdrop-blur-sm rounded-[28px] shadow-sm border-[3px] border-cute-50 hover:border-cute-100 transition-colors">
                                <label class="block text-[12px] font-bold text-slate-500 w-full text-center">โลโก้ร้าน (PNG/JPG)</label>
                                <div class="relative w-[90px] h-[90px] rounded-full border-[3px] border-dashed border-cute-300 overflow-hidden group cursor-pointer hover:border-cute-500 transition-colors bg-cute-50/50" onclick="triggerUpload('upload-logo')">
                                    ${appData.store.logo ? `<img src="${escapeHTML(appData.store.logo)}" alt="Logo Preview" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center scale-75 text-cute-300">${icons.camera}</div>`}
                                    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center upload-overlay">
                                        <div class="text-white scale-75">${icons.camera}</div>
                                    </div>
                                </div>
                                ${appData.store.logo ? `<button onclick="openDeleteModal('logo')" class="text-[12px] text-slate-400 hover:text-red-500 underline decoration-dotted mt-1">ลบรูปนี้</button>` : ''}
                            </div>

                            <div class="flex flex-col items-center space-y-3 p-5 bg-white/90 backdrop-blur-sm rounded-[28px] shadow-sm border-[3px] border-cute-50 hover:border-cute-100 transition-colors">
                                <label class="block text-[12px] font-bold text-slate-500 w-full text-center">รูปใต้คำโปรย</label>
                                <div class="relative w-full h-[90px] rounded-[20px] border-[3px] border-dashed border-cute-300 overflow-hidden group cursor-pointer hover:border-cute-500 transition-colors bg-cute-50/50" onclick="triggerUpload('upload-content')">
                                    ${appData.store.contentImage ? `<img src="${escapeHTML(appData.store.contentImage)}" alt="Content Preview" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center scale-75 text-cute-300">${icons.camera}</div>`}
                                    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center upload-overlay">
                                        <div class="text-white scale-75">${icons.camera}</div>
                                    </div>
                                </div>
                                ${appData.store.contentImage ? `<button onclick="openDeleteModal('content')" class="text-[12px] text-slate-400 hover:text-red-500 underline decoration-dotted mt-1">ลบรูปนี้</button>` : ''}
                            </div>
                        </div>

                        <div class="bg-white/90 backdrop-blur-sm p-2 rounded-[28px] shadow-sm border-[3px] border-cute-50">
                            <textarea rows="3" onchange="updateStoreText('tagline', this.value)" placeholder="คำโปรย หรือข้อความต้อนรับ..." class="w-full px-5 py-4 text-[15px] bg-transparent rounded-xl focus:bg-cute-50/30 outline-none resize-none transition-colors text-slate-700 leading-relaxed">${escapeHTML(appData.store.tagline)}</textarea>
                        </div>
                    </div>

                    <div class="space-y-5 pb-8">
                        <div class="flex justify-between items-center px-2">
                            <div class="flex items-center space-x-2">
                                <div class="w-2.5 h-6 bg-cute-400 rounded-full"></div>
                                <h2 class="text-[16px] font-bold text-slate-700">ช่องทางรับเงิน</h2>
                            </div>
                            <button onclick="addPaymentMethod()" class="text-[13px] font-bold bg-cute-500 hover:bg-cute-600 text-white px-5 py-2.5 rounded-[14px] transition-all shadow-[0_4px_14px_0_rgba(59,130,246,0.4)] hover:shadow-[0_6px_20px_rgba(59,130,246,0.25)] hover:-translate-y-0.5 active:translate-y-0 flex items-center space-x-1">
                                <span>+ เพิ่มช่องทาง</span>
                            </button>
                        </div>

                        <div class="space-y-5">
                            ${paymentsAdminHTML}
                            ${appData.payments.length === 0 ? '<div class="text-center text-slate-400 py-10 bg-white/80 backdrop-blur-sm rounded-[28px] border-[3px] border-dashed border-cute-200 font-medium text-[15px]">ยังไม่มีข้อมูล กรุณาเพิ่มช่องทาง</div>' : ''}
                        </div>
                    </div>
                </div>
            `;
        };

        const render = () => {
            const container = document.getElementById('content-container');
            
            if (isFetching) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-screen space-y-4 animate-[floatUp_0.3s_ease-out]">
                        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-cute-500"></div>
                        <span class="text-cute-600 font-medium text-[15px]">กำลังโหลดข้อมูล...</span>
                    </div>
                `;
                return;
            }

            if (fetchError) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-screen space-y-4 text-center px-6 animate-[floatUp_0.3s_ease-out]">
                        <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center text-red-500 mb-2 shadow-sm">
                            <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <span class="text-red-500 font-bold text-[18px]">เกิดข้อผิดพลาด</span>
                        <span class="text-slate-500 text-[14px] leading-relaxed">${escapeHTML(fetchError)}</span>
                        <button onclick="loadDataFromDB()" class="mt-4 px-8 py-3 bg-cute-500 hover:bg-cute-600 text-white font-bold text-[15px] rounded-full shadow-md transition-colors">ลองใหม่อีกครั้ง</button>
                    </div>
                `;
                return;
            }

            if (currentView === 'public') container.innerHTML = renderPublicView();
            else container.innerHTML = renderAdminView();
        };

        window.onload = async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                const { data: isAdmin } = await supabaseClient.rpc('is_admin');
                if (isAdmin) isLoggedIn = true;
            }
            loadDataFromDB();
        };
    </script>
</body>
</html>
